[SystemSettings]
t.MaxFPS=0
; Nanite streaming pool: generated vegetation is ~600 triangles per species (resident root pages),
; so the 512 MB default was idle VRAM (measured -350 MB at 128; S_tq_forest perf pose).
r.Nanite.Streaming.StreamingPoolSize=128
; Dense generated foliage is Nanite's software-raster worst case (thousands of disjoint needle
; triangles per tree). 2-pixel triangles and half-resolution directional VSM pages cut the low
; flyover pose (S_tq_forest fly_a) from 16.0 to 7.8 ms GPU with no visible difference at 1440p.
r.Nanite.MaxPixelsPerEdge=2
r.Shadow.Virtual.ResolutionLodBiasDirectional=1
r.DepthOfFieldQuality=0

