name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}   # login shell so the conda env is active
    steps:
      - uses: actions/checkout@v4

      # Full geospatial + weather stack from conda-forge (mirrors environment.yml), so
      # the geo tests (arrival raster, etc.) run end-to-end offline in CI.
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: ember

      - name: Install terrain (engine) + ember
        run: |
          pip install "terrain @ git+https://github.com/WheezardX/Terrain.git"
          pip install -e . --no-deps

      - name: Lint
        run: ruff check .

      # Network tests auto-skip without TERRAIN_RUN_NETWORK; geo tests run (stack present).
      - name: Tests (offline)
        run: pytest -q
