# Asset generators (EPIC_5_PLAN §3, B1). Every .uasset under unreal/Ember/Content/Ember/Generated
# is produced by exactly one generator listed here; `ember-dev regen-assets` runs them headless
# (UnrealEditor-Cmd -run=pythonscript) and rewrites assets/generated.lock.json.
# `ember-dev regen-assets --check` (engine-free, CI-safe) fails if any generator changed since
# the lock was written, or if a generated asset exists that no generator claims.

[[generator]]
script = "m_ember_gray.py"
outputs = ["/Game/Ember/Generated/M_EmberGray"]

[[generator]]
script = "t_ground.py"
depends = ["ground_tex_host.py"]
outputs = [
  "/Game/Ember/Generated/Ground/T_Ground_Litter_C", "/Game/Ember/Generated/Ground/T_Ground_Litter_N",
  "/Game/Ember/Generated/Ground/T_Ground_Grass_C", "/Game/Ember/Generated/Ground/T_Ground_Grass_N",
  "/Game/Ember/Generated/Ground/T_Ground_Rock_C", "/Game/Ember/Generated/Ground/T_Ground_Rock_N",
  "/Game/Ember/Generated/Ground/T_Ground_Shrub_C", "/Game/Ember/Generated/Ground/T_Ground_Shrub_N",
]

[[generator]]
script = "m_terrain.py"
outputs = ["/Game/Ember/Generated/M_Terrain", "/Game/Ember/Generated/T_LinearBlack"]

[[generator]]
script = "m_veg.py"
outputs = ["/Game/Ember/Generated/M_Veg"]

