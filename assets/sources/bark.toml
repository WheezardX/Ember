# Bark texture sources (2026-10-01, Brad: "go with the CC0 libraries for now" - Fab / Megascans and
# his own bark photos of the Kachess trees may replace the main species later).
# Fetched by `ember-dev fetch-textures assets/sources/bark.toml` into store/textures/bark/<key>/
# (outside git; metered in the download ledger). Every set is CC0: shippable, no attribution needed
# (credited here anyway). 2K JPG: bark only reads within ~30-50 m of the camera.
# Species keys are the tree generator's (assets/generators/treegen.py CONIFERS).

[[set]]
key = "douglas_fir"
source = "polyhaven"
id = "bark_willow_02"
licence = "CC0"
species = ["pseudotsuga_menziesii"]
why = "deep grey-brown furrows, raised corky ridges; tinted red-brown in the material (Brad picked it 2026-10-01 over bark_brown_01, too tan / fine). Weakest match of the set - first to replace with a photo of a Kachess Doug-fir"

[[set]]
