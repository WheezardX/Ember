# Terrain look (EPIC_5_PLAN B2): how store layers become ground colour. Data, not code:
# tuning the look is an edit here (no material recompile, no C++ change). Composed per tile by
# worldcore/look.cpp into an albedo texture; M_Terrain adds only lighting-scale detail.
#
# Colours are sRGB hex. Classes key on Scott & Burgan FBFM40 codes (LANDFIRE), the layer every
# fire world carries. Order of operations per pixel:
#   base(class) -> mix toward `green` by NDVI (vegetated classes only) -> darken by canopy
#   cover -> blend toward `rock` on steep slopes. Water/snow/urban skip the vegetation steps.
look_version = 1
name = "terrain_default"

[classes]
unknown     = "#7A7566"
urban       = "#807D70"   # NB1 91
snow        = "#EEF1F4"   # NB2 92
agriculture = "#9C9A5C"   # NB3 93
water       = "#2F4A5A"   # NB8 98
barren      = "#CABDA6"   # NB9 99 (NAIP: bright, warm)
grass       = "#A09C80"   # GR 101-109 (cured grass reads tan; NDVI greens it)
grass_shrub = "#8E8A6C"   # GS 121-124
shrub       = "#7A7658"   # SH 141-149
timber_understory = "#4F5A3A"  # TU 161-165
timber_litter     = "#55553B"  # TL 181-189
slash_blowdown    = "#6A5E48"  # SB 201-204

[vegetation]
green          = "#56673E"   # full-vigour colour NDVI pulls toward
ndvi_low       = 0.25        # at/below: no greening
ndvi_high      = 0.85        # at/above: full greening
green_strength = 0.55        # max mix fraction toward `green`
canopy_darken  = 0.30        # colour *= 1 - canopy_darken * cc/100 (shade under canopy)

[slope]
rock           = "#BDB2A0"
start_deg      = 35.0        # rock blending begins
full_deg       = 55.0        # fully rock

[detail]
supersample      = 4     # texels per source pixel per axis (breaks the 10 m grid)
boundary_warp_px = 1.0   # world-aligned wiggle of class boundaries, in source pixels
blur_radius_px   = 0.6   # softening, in source pixels (two box passes); 0 = hard edges

# Ground plane v1 (EPIC_5_PLAN 8f): what lies on the ground near the camera, per class, as
# weights of four detail sets [litter, grass, rock, shrub]; the remainder is plain soil. Canopy
# cover turns grass/shrub into litter; steep slopes blend to rock (the [slope] rule above).
[ground]
canopy_to_litter = 0.8
[ground.classes]
agriculture       = [0.0, 0.9, 0.0, 0.0]
urban             = [0.1, 0.25, 0.35, 0.0]   # NB1 in wildland: roads, pads, campsites (gravel, dirt)
barren            = [0.0, 0.0, 0.8, 0.0]
grass             = [0.0, 0.9, 0.0, 0.0]
grass_shrub       = [0.05, 0.55, 0.0, 0.35]
shrub             = [0.15, 0.2, 0.05, 0.55]
timber_understory = [0.5, 0.1, 0.0, 0.35]
timber_litter     = [0.85, 0.05, 0.0, 0.05]
slash_blowdown    = [0.9, 0.0, 0.0, 0.05]

# Ground cover (ground plane v1 GP4): near-camera instances, density per 100 m2 on each ground set
# ([ground] above) and on plain soil. Placement is a hash on the global 1 m lattice
# (worldcore/cover.cpp), so it never depends on streaming cells.
[cover]
candidates_per_m2 = 3
[cover.items.grass]        # the scatter's bunchgrass meshes, as small tufts
consume = 1.0
grass = 220.0
shrub = 25.0
litter = 6.0
soil = 10.0
height_min_m = 0.25
height_max_m = 0.55
variants = 4
[cover.items.fern]         # sword fern: under canopy on litter
consume = 1.0
litter = 14.0
shrub = 8.0
height_min_m = 0.45
height_max_m = 0.9
[cover.items.huckleberry]  # fall reds (Three Queens field photo)
consume = 1.0
litter = 4.0
shrub = 30.0
grass = 2.0
height_min_m = 0.4
height_max_m = 0.9
[cover.items.shrub]
consume = 1.0
shrub = 35.0
litter = 3.0
grass = 3.0
height_min_m = 0.35
height_max_m = 0.8
[cover.items.rock]         # cobbles
rock = 45.0
grass = 1.5
shrub = 2.0
litter = 1.0
soil = 2.0
height_min_m = 0.08
height_max_m = 0.4
[cover.items.boulder]      # the same meshes, rare and big
mesh = "rock"
rock = 3.0
grass = 0.15
shrub = 0.2
litter = 0.15
height_min_m = 0.5
height_max_m = 1.1
[cover.items.log]          # down wood on the forest floor: lies along the slope, partly buried,
pose = "conform"           # ~15 % propped (8g)
smoulder = 1.0
litter = 1.2
shrub = 0.2
height_min_m = 0.35
height_max_m = 0.6
[cover.items.stump]
smoulder = 1.0
litter = 0.5
height_min_m = 0.4
height_max_m = 1.0
[cover.items.snag]         # standing dead trees, broken tops (~25 / ha under timber) (8g)
smoulder = 1.0
litter = 0.25
shrub = 0.05
height_min_m = 3.0
height_max_m = 9.0
variants = 3
[cover.items.leaner]       # a fallen stem hung up in its neighbours, pitched 20-40 deg (8g)
mesh = "pole"              # height = the stem's diameter (a lying mesh, like a log)
pose = "leaner"
smoulder = 1.0
litter = 0.08
height_min_m = 0.18
height_max_m = 0.32
variants = 2
