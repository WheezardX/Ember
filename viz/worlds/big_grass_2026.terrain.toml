# Render world for the BIG GRASS fire, 2026 (IRWIN {6B0C72B3-0E12-4695-9022-E1113C0AA8D1}):
# Owyhee sage/grass rangeland, SE Oregon / SW Idaho - the rangeland contrast to Three Queens and
# Jolly Mountain. A Terrain pipeline config; from the Ember repo root:
#
#   terrain run --config viz/worlds/big_grass_2026.terrain.toml --store ../Terrain/store
#
# The whole fire (U6 chunked ingest, Terrain ADR 0008): the AOI is the 2026-08-24 perimeter
# polygon (2,326 km2); the grid is its bounding box (~83 x 103 km), tile-anchored so it can grow.
# Bandwidth (household data cap): LiDAR is fetched only for chunks within 200 m of the
# perimeter (clip_to_aoi); Copernicus 30 m fills the rest of the box. 3DEP here:
# ID_SouthernID_2_2018, ID_SouthernID_21_2018, ID_SouthernID_4_SA2_2018, OR_SouthEast_4_D22 -
# all flown before the fire, so the canopy (sagebrush height) is pre-fire too.
#
# PRE-FIRE world (discovered 2026-07-23): fuels pinned to LF2025 (disturbances through 2024),
# never "latest" (U10). Season OFF for now: the fire spans several Sentinel-2 tiles and needs
# per-tile scene selection. Vegetation OFF until a Great Basin palette exists.
# No fire replay yet: one final perimeter only; a progression needs IR/FIRMS timing (Epic 3).

[project]
name = "big_grass_2026"
crs  = "EPSG:32611"

[aoi]
type    = "geojson"
geojson = "store/incidents/6b0c72b3-0e12-4695-9022-e1113c0aa8d1/observations/perimeters/20260824T0310_a9b29331e167.geojson"
crs     = "EPSG:4326"

[dem]
profile        = "game"              # 10 m
sources        = ["3dep-ept", "copernicus-30m"]
vertical_datum = "navd88"
fill_voids     = true

[dem.thinning]
points_per_cell = 4

[tiling]
scheme     = "quadtree"
tile_px    = 128                     # 1.28 km content tiles at 10 m
overlap_px = 8
base_lod   = 14
num_lods   = 4
anchor     = "grid"                  # tile-aligned in UTM 11N: the region can grow

[ingest]
max_chunk_mb  = 2048
chunk_tiles   = 2                    # 2.56 km chunks: finer LiDAR clipping than the default
clip_to_aoi   = true
clip_buffer_m = 200.0
max_fetch_gb  = 12.0                 # hard stop on LiDAR download (Brad approved ~12 GB)

[outputs.heightmap]
enabled = true
format  = "png16"

[outputs.gltf_tiles]
enabled = false

[outputs.gltf]
enabled = false

[outputs.stl]
enabled = false

[fuels]
enabled          = true
landfire_version = "LF2025"          # pre-fire, pinned

[canopy]
enabled = true                       # pre-fire LiDAR: shrub / juniper heights

[season]
enabled = false

[vegetation]
enabled                = false       # needs a Great Basin palette first
palette                = "packs/palettes/cascades_mixed_conifer.toml"
world_seed             = 1337
layer_version          = 2
candidates_per_cell    = 4
max_instances_per_tile = 20000000
preview                = false
