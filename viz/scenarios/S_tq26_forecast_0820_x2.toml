# External Sources X2 gate: the same PyreCast forecast (2026-08-20 05:11 UTC, p90 - the member with
# real crown fire) drawn class-based (fire_channels = false, the X1 renderer) vs channel-driven
# (ADR 0010: the source's flame length, crown class and spread rate per cell). Run + 40 h (Aug 21
# 21:11 UTC), the hour of the p90 run's most active crown fire. Views on the source's own cells:
# cells on the live front (arrived in the last 10 min): active crown fire (9.4 m), torching
# (4.0 m), a quiet surface fire (0.3 m), and an oblique over the active crown fire; each camera
# behind the front looking along the local spread direction (the arrival gradient). Replays are
# built locally from the internal PyreCast mirror - INTERNAL ONLY (EXTERNAL_SOURCES_PLAN rule 1). The X2 bundle renders this twice (fire_channels on / off).
render_scenario_version = 1

[scenario]
name = "S_tq26_forecast_0820_x2"
description = "Three Queens 2026: the Aug 20 PyreCast forecast (p90) at run + 40 h - class-based vs the source's own flame length / crown class"
world = "terrain:three_queens_2026"
replay = "../../runs/tq26-fc0820-p90/tq26-fc0820-p90.replay.json"
resolution = [1600, 900]
look = "viz/looks/terrain_default.toml"
vegetation = true
veg_radius_m = 3000
ground_cover = true
exposure_bias = -2.0
wind_from_deg = 225
smoke_wind_ms = 5.0
smoke = false               # the A/B is about the flames and the crowns: our smoke hid them
play_start_s = 3163380       # play: run + 38 h, just before the p90 run's most active crown fire
play_rate_h = 0.5

