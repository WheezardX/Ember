# Look lab (Brad 2026-10-01, after smoke v2: "it looks like the smoke is animating back into the
# ground at least 50% of the time ... mid and far distances are very bouncy"). The Aug 21 2026
# Three Queens run from 4 km - the 3 km own-column / merged-cell cross-fade runs through the
# middle of the fire - with fire time sweeping 2 h in 4 s like play at a fast rate. A fixed camera
# so the motion is the smoke's own (scratch flowdir.py: share of moving smoke going down).
render_scenario_version = 1

[scenario]
name = "L_smoke_mid_motion"
description = "Look lab: 4 s of the Aug 21 2026 run from 4 km while fire time sweeps 2 h (smoke must only rise)"
world = "terrain:three_queens_2026"
replay = "../../runs/tq26/tq26-ir-playback.replay.json"
resolution = [1600, 900]
look = "viz/looks/terrain_default.toml"
vegetation = true
veg_radius_m = 3000
exposure_bias = -2.0
wind_from_deg = 225
smoke_wind_ms = 5.0

[[bookmarks]]
name = "mid_sw"
target_frac = [0.628, 0.429]
distance_m = 4000
yaw_deg = 45
pitch_deg = -5
fov_deg = 60
sun = "afternoon"

[[captures]]
name = "mid_aug21_886h"
bookmark = "mid_sw"
t_s = 3189600
reference = "../../store/reference/facebook-3q/facebook-3q-undated-78f0f1fc.jpg"

[[orbits]]
name = "sweep"               # fixed camera, fire time 886 -> 888 h over 4 s
bookmark = "mid_sw"
degrees = 0
frames = 120
fps = 30
t_from_s = 3189600
t_to_s = 3196800
