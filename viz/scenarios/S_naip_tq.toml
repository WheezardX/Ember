# NAIP colour probe (EPIC_5_PLAN 8i R2): straight-down captures over a 3 x 3 grid of sites,
# 2.5 km up (low enough that vegetation streams in; each footprint ~1.8 km at 40 deg), noon sun,
# fog and atmosphere off (NAIP is atmospherically corrected). `ember-dev naip-probe S_naip_tq`
# compares render vs NAIP colour per fuel group (advisory). Needs `ember-dev naip three_queens_2026`.
render_scenario_version = 1

[scenario]
name = "S_naip_tq"
description = "8i R2: straight-down probe sites for the NAIP colour comparison, Three Queens"
world = "terrain:three_queens_2026"
resolution = [1600, 1600]
look = "viz/looks/terrain_default.toml"
vegetation = true
veg_radius_m = 3500
exec_cmds = ["ShowFlag.Fog 0", "ShowFlag.Atmosphere 0"]

[[bookmarks]]
name = "site_00"
target_frac = [0.2, 0.2]
distance_m = 2500
yaw_deg = 0
pitch_deg = -89.9
fov_deg = 40
sun = "noon"

