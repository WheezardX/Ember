# Look lab (Brad 2026-10-01): one view, small world, fast. Fire = a 24 h synthetic fire with intensity
# classes on teanaway_dev (head 3 / flank 2 / backing 1), regenerate with:
#   ember-dev synth-fire teanaway_dev --hours 24 --ignition 0.25,0.5 --classes --name lab
render_scenario_version = 1

[scenario]
name = "L_flames"
description = "Look lab: surface fire front at ground level (flame cards, glow, scorch) - synthetic fire with classes"
world = "terrain:teanaway_dev"
replay = "../../store/render/teanaway_dev/fire/lab.replay.json"
resolution = [1600, 900]
look = "viz/looks/terrain_default.toml"
vegetation = true
veg_radius_m = 1500
veg_near_radius_m = 400
ground_cover = true
exposure_bias = -2.0

[[bookmarks]]
name = "flames_front"
# Flames v2 (2026-10-01) draw only the front line's flaming band, not every cell the model calls
# burning: the old target (the 6 h front centroid) sits in the scar ~260 m behind the line. This is
# the line itself at 6 h (timber, class 3, torching), from ~50 m on the burned side.
camera_xy = [657595.0, 5231077.0]
yaw_deg = 45
pitch_deg = 2
fov_deg = 60
sun = "afternoon"

[[bookmarks]]
name = "flames_front_t"     # the same line as an orbit target (orbits need one): (657630, 5231112)
target_frac = [0.580, 0.145]
distance_m = 50
yaw_deg = 225
pitch_deg = -3
fov_deg = 60
sun = "afternoon"


[[captures]]
name = "flames_front"
bookmark = "flames_front"
t_s = 21600
reference = "../../store/reference/video-wetc/video-wetc-undated-ab746d3c.jpg"

[[orbits]]
name = "burn"                # fixed camera, 4 s real time while fire time runs 6 h -> 6 h 10 min
bookmark = "flames_front_t"
degrees = 0
frames = 120
fps = 30
t_from_s = 21600
t_to_s = 22200
