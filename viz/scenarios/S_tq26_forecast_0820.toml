# External Sources X1.5: the forecast as issued, beside what happened. Three Queens 2026, the
# PyreCast / ELMFIRE run of 2026-08-20 05:11 UTC (the last before the Aug 21 blow-up; the same
# timestamp as that night's NIROPS flight). R = 3,026,580 s after the pack's t0 (840.7 h).
# This file points at the p50 replay; the X1 bundle (ember.external.x1) renders the same views for
# p10 / p90 and for the observed playback by swapping `replay`, and renders each a second time
# with smoke off for the growth_top map view and the timelapse (the smoke is ours, not the model's,
# and it hides the fronts). Replays are built locally from the internal PyreCast mirror (store/,
# git-ignored) - INTERNAL ONLY, never a pitch or public video without PyreCast's written
# permission (EXTERNAL_SOURCES_PLAN rule 1).
render_scenario_version = 1

[scenario]
name = "S_tq26_forecast_0820"
description = "Three Queens 2026: the Aug 20 05:11 UTC PyreCast forecast (p50) as issued - observed until the run, then the forecast"
world = "terrain:three_queens_2026"
replay = "../../runs/tq26-fc0820-p50/tq26-fc0820-p50.replay.json"
resolution = [1600, 900]
look = "viz/looks/terrain_default.toml"
vegetation = true
veg_radius_m = 4000
ground_cover = true
exposure_bias = -2.0
wind_from_deg = 225
smoke_wind_ms = 5.0
play_start_s = 3026580       # the run time
play_rate_h = 2.0

[[bookmarks]]
name = "aug21_run"            # the Aug 21 run area from the SW, 9 km out (as S_tq26_play)
target_frac = [0.628, 0.429]
distance_m = 9000
yaw_deg = 45
pitch_deg = -12
fov_deg = 55
sun = "afternoon"

[[bookmarks]]
name = "kachess_hero"         # Lake Kachess, looking north up the lake (as S_tq26_play)
target_frac = [0.603, 0.623]
distance_m = 3000
yaw_deg = 345
pitch_deg = -25
fov_deg = 60
sun = "afternoon"

[[bookmarks]]
name = "growth_top"           # high, steep, over the forecast growth (E / NE of the scar): the map view
target_frac = [0.64, 0.50]
distance_m = 11000
yaw_deg = 20
pitch_deg = -62
fov_deg = 50
sun = "noon"

[[captures]]
name = "aug21_run_24h"
bookmark = "aug21_run"
t_s = 3112980                # run + 24 h (Aug 21 05:11 UTC)
golden = false

[[captures]]
name = "aug21_run_48h"
bookmark = "aug21_run"
t_s = 3199380                # run + 48 h (Aug 22 05:11 UTC)
golden = false

[[captures]]
name = "kachess_hero_24h"
bookmark = "kachess_hero"
t_s = 3112980
golden = false

[[captures]]
name = "kachess_hero_48h"
bookmark = "kachess_hero"
t_s = 3199380
golden = false

[[captures]]
name = "growth_top_24h"
bookmark = "growth_top"
t_s = 3112980
golden = false

[[captures]]
name = "growth_top_48h"
bookmark = "growth_top"
t_s = 3199380
golden = false

[[orbits]]
name = "timelapse_72h"       # fixed camera over the growth, the run -> + 72 h in 12 s
bookmark = "growth_top"
degrees = 0
frames = 360
fps = 30
t_from_s = 3026580
t_to_s = 3285780
