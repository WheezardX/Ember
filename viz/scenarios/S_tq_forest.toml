# HCP2 "The forest is real" - Three Queens 2026 with Terrain's full-density scatter (190 trees/ha,
# 5.86 M instances over the AOI; every one conformant - see worldcore scatter_test). Trees are
# instanced within veg_radius_m of the camera; past it the look's canopy darkening carries the
# forest (the near/far split is D11's near-field tier).
# Sites: fire centroid; the densest flat-ish stand near it (CC 78 %, CHM 40 m); a forested ridge
# with 120 m local relief WSW of the fire; a clearing by Kachess facing a stand edge.
render_scenario_version = 1

[scenario]
name = "S_tq_forest"
description = "HCP2: Three Queens forest - oblique, ground-level, ridge; density flyover + sway orbit; perf with full instancing"
world = "terrain:three_queens_2026"
resolution = [2560, 1440]
budget = "interactive"
perf_frames = 300
perf_bookmark = "forest_oblique"
look = "viz/looks/terrain_default.toml"
lod_refine_factor = 1.5
vegetation = true
veg_radius_m = 4000
wind_strength = 6.0
wind_from_deg = 250          # prevailing WSW
exposure_bias = -2.0

[[bookmarks]]
name = "forest_oblique"      # the burn area from the west, 2.2 km out
target_frac = [0.507, 0.488]
distance_m = 2200
yaw_deg = 90
pitch_deg = -22
fov_deg = 55
sun = "afternoon"

[[bookmarks]]
name = "ground_forest"       # standing in a clearing (eye ~3 m) facing a CC 58 % stand edge 120 m N
target_frac = [0.343, 0.840]  # (inside the densest stand, Lumen goes black: camera in the canopy)
distance_m = 120
yaw_deg = 0
pitch_deg = 1
fov_deg = 70
sun = "afternoon"

[[bookmarks]]
name = "ridge"               # forested ridge from its downhill (WSW) side
target_frac = [0.316, 0.613]
distance_m = 900
yaw_deg = 60
pitch_deg = -8
fov_deg = 55
sun = "afternoon"

[[bookmarks]]
name = "fly_a"               # flyover start: over the dense stand, heading NNE to the fire
target_frac = [0.433, 0.625]
distance_m = 350
yaw_deg = 31
pitch_deg = -20
fov_deg = 60
sun = "afternoon"

[[bookmarks]]
name = "fly_b"
target_frac = [0.48, 0.54]
distance_m = 350
yaw_deg = 31
pitch_deg = -20
fov_deg = 60
sun = "afternoon"

[[bookmarks]]
name = "sway_close"          # close enough to judge the wind sway
target_frac = [0.433, 0.625]
distance_m = 220
yaw_deg = 60
pitch_deg = -10
fov_deg = 50
sun = "afternoon"

[[captures]]
name = "forest_oblique"
bookmark = "forest_oblique"

[[captures]]
name = "ground_forest"
bookmark = "ground_forest"

[[captures]]
name = "ridge"
bookmark = "ridge"

[[orbits]]
name = "density_flyover"
bookmark = "fly_a"
to_bookmark = "fly_b"
frames = 450
fps = 30

[[orbits]]
name = "sway_close"
bookmark = "sway_close"
degrees = 20
frames = 300
fps = 30

[[assert]]
fact = "instances.ungrounded"
op = "=="
value = 0

[[assert]]
fact = "instances.generated_species"
op = "=="
value = 5

[[assert]]
fact = "instances.total"
op = ">"
value = 500000
capture = "forest_oblique"
