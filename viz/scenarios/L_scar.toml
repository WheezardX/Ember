# Look lab (Brad 2026-10-01): one view, small world, fast. Fire = a 24 h synthetic fire with intensity
# classes on teanaway_dev (head 3 / flank 2 / backing 1), regenerate with:
#   ember-dev synth-fire teanaway_dev --hours 24 --ignition 0.25,0.5 --classes --name lab
render_scenario_version = 1

[scenario]
name = "L_scar"
description = "Look lab: burned mosaic from above (survivors, scorch, char)"
world = "terrain:teanaway_dev"
replay = "../../store/render/teanaway_dev/fire/lab.replay.json"
resolution = [1600, 900]
look = "viz/looks/terrain_default.toml"
vegetation = true
veg_radius_m = 1500
veg_near_radius_m = 400
ground_cover = true
exposure_bias = -2.0

[[bookmarks]]
name = "scar_above"
target_frac = [0.5, 0.45]   # front / scar from the lab fire arrival field
distance_m = 600
yaw_deg = 30
pitch_deg = -45
fov_deg = 55
sun = "noon"


[[captures]]
name = "scar_above"
bookmark = "scar_above"
t_s = 72000
reference = "../../store/reference/video-swfsc/video-swfsc-undated-24640519.jpg"
