# Look lab (Brad 2026-10-01: from the ground the scene is too dark - navy sky, dim terrain, grey
# smoke vs the photos' bright blue sky and white sunlit columns). The Lake Kachess shore, west side,
# looking NE at the Aug 9 2026 front (the InciWeb photo from Lake Kachess Road that afternoon), and
# the same view the afternoon before the fire woke (clean sky / exposure check). Three Queens world.
render_scenario_version = 1

[scenario]
name = "L_sky"
description = "Look lab: ground-level sky / exposure - the Kachess shore with and without the Aug 9 2026 front"
world = "terrain:three_queens_2026"
replay = "../../runs/tq26/tq26-ir-playback.replay.json"
resolution = [1600, 900]
look = "viz/looks/terrain_default.toml"
vegetation = true
veg_radius_m = 3000
exposure_bias = -2.0
wind_from_deg = 225
smoke_wind_ms = 5.0

[[bookmarks]]
name = "shore"
camera_xy = [632200.0, 5245000.0]
camera_alt_m = 693
yaw_deg = 45
pitch_deg = 10
fov_deg = 62
sun = "afternoon"

[[captures]]
name = "shore_aug9_594h"      # Aug 9 ~15:30 PDT, the front on the east shore
bookmark = "shore"
t_s = 2138400
reference = "../../store/reference/inciweb-3q/inciweb-3q-2026-08-09-f00a39f8.jpg"

