g679  = { up = [[35,55],[15,35],[0,15],[0,0]],     down = [[55,60],[40,60],[0,40],[0,0]] }
g1112 = { up = [[15,25],[7,15],[0,7],[0,0]],       down = [[25,30],[10,30],[0,10],[0,0]] }
g1013 = { up = [[8,15],[3,8],[0,3],[0,0]],         down = [[10,15],[5,10],[0,5],[0,0]] }

