# ---- Air resources (v1 cartoon; NOT from the NWCG tables) ------------------------------
# Footprint half-width in cells (30 m cells): a large airtanker drop is ~ 60-100 m wide and
# several hundred m long; SEAT narrower; bucket ~ one cell. Loads are per-cell coverage
# permille; decay classes index `retardant_decay_permille_per_hour` in the CA params pack.
[airtanker_large]
label = "Large airtanker (retardant), ~3000 gal"
sortie_delay_s = 1800
turnaround_s = 2700
footprint_half_width_cells = { 1 = 1, 2 = 1, 3 = 2 }
retardant_load_permille    = { 1 = 600, 2 = 850, 3 = 1000 }
decay_class = 1
cost_per_drop_usd = 15000  # PLACEHOLDER

[airtanker_seat]
label = "Single-engine airtanker (retardant), ~800 gal"
sortie_delay_s = 900
turnaround_s = 1500
footprint_half_width_cells = { 1 = 0, 2 = 0, 3 = 1 }
retardant_load_permille    = { 1 = 400, 2 = 600, 3 = 800 }
decay_class = 1
cost_per_drop_usd = 4000   # PLACEHOLDER

[helicopter_bucket]
label = "Type 2 helicopter, bucket (water)"
sortie_delay_s = 600
turnaround_s = 600
footprint_half_width_cells = { 1 = 0, 2 = 0, 3 = 1 }
water_bump_m10             = { 1 = 60, 2 = 100, 3 = 150 }   # tenths of a percent moisture
water_ttl_s                = { 1 = 1200, 2 = 1800, 3 = 2700 }
cost_per_drop_usd = 2500   # PLACEHOLDER

# ---- Burnout / mop-up rates (v1 cartoon) -------------------------------------------------
[burnout]
firing_rate_chains_per_hour = 20     # strip firing walk along the anchor path

[mop_up]
cells_per_hour = { hand_t1 = 12, hand_t2 = 8, dozer_t1 = 0, dozer_t2 = 0, dozer_t3 = 0 }
