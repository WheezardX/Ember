# Three Queens 2026 replayed from the NIROPS IR perimeter series (31 night flights, Aug 7 -> Sep 20)
# + every VIIRS/MODIS detection of the season (timing) + the Jul 16 - Aug 6 holdover (synthetic
# circles of the mapped 5-88 ac at the July detections), the 2026 counterpart of
# cp2-jolly-playback. Arrival from `python -m ember.incidents.tq_nirops_2026`; world pack from
# `ember sim export --bundle .../package/scenario.bundle.nirops.json --name hist-three-queens-2026-ir`.
# t0 = discovery, 2026-07-16 04:28Z (Jul 15 21:28 PDT). The fire wakes up Aug 6 (~509 h).
scenario_version = 1

[scenario]
name = "tq26-ir-playback"
world = "../../store/sim/hist-three-queens-2026-ir.ewp"
t_start_s = 0
duration_s = 5796000        # 1,610 h - Jul 16 04Z -> Sep 21 06Z
dt_s = 3600                 # hourly ticks
seed = 1

[model]
id = "arrival-playback"

[model.overrides]
"playback.residence_s" = 21600   # same 6 h glow as the Jolly playback (the IR says real heat lingered for weeks)

[weather]
mode = "constant"

[output]
dir = "../../runs/tq26"
keyframe_every = 24
stream = true
