# CP5 - the observed progression over the same 120-h window, via the playback driver, for the
# split-screen against cp5-jolly-shadow-ca. Same t_start, duration, dt, and world pack.
scenario_version = 1

[scenario]
name = "cp5-jolly-shadow-playback"
world = "../../store/sim/hist-jolly-mountain-2017.ewp"
